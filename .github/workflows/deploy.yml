name: build + push + deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Compilar imagen Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Loguearse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en servidor prod
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Conectar al servidor y actualizar contenedor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_APP_HOST }}
          username: ${{ secrets.PROD_APP_USER }}
          key: ${{ secrets.PROD_APP_KEY }}
          port: ${{ secrets.PROD_APP_PORT }}
          proxy_host: ${{ secrets.PROD_BASTION_HOST }}
          proxy_username: ${{ secrets.PROD_BASTION_USER }}
          proxy_key: ${{ secrets.PROD_BASTION_KEY }}
          proxy_port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/ecommerce/casa-color
            docker compose pull frontend
            docker compose up -d --no-deps --build frontend
            docker compose ps frontend
            echo "Deployed frontend:${{ needs.build.outputs.tag }}"

      - name: Borrar keys temporales
        if: always()
        run: rm -f ~/.ssh/*_deploy_key || true
