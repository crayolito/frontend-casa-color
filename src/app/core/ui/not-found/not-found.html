<main class="not-found">
  <div class="not-found__inner">
    <p class="not-found__code" aria-hidden="true">404</p>
    <h1 class="not-found__title">Página no encontrada</h1>
    <p class="not-found__text">
      La ruta <code class="not-found__path">{{ path }}</code> no existe o fue
      movida.
    </p>

    <div class="not-found__actions">
      <a routerLink="/" class="not-found__btn not-found__btn--primary">
        Volver al inicio
      </a>
      <a routerLink="/search" class="not-found__btn not-found__btn--ghost">
        Buscar productos
      </a>
    </div>

    <nav class="not-found__links" aria-label="Enlaces útiles">
      <a routerLink="/cartas-de-color">Cartas de color</a>
      <a routerLink="/fichas-tecnicas">Fichas técnicas</a>
      <a routerLink="/contacto">Contacto</a>
    </nav>
  </div>
</main>
