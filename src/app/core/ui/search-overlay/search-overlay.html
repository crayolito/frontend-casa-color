<div
  class="search-overlay"
  role="dialog"
  aria-modal="true"
  aria-label="Buscar"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
>
  <button type="button" class="search-overlay__close" (click)="close()" aria-label="Cerrar búsqueda">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M6 6l12 12M18 6L6 18"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  </button>

  <div class="search-overlay__box">
    <form class="search-overlay__form" (submit)="onSubmit($event)">
      <label class="sr-only" for="search-overlay-input">Buscar</label>
      <input
        id="search-overlay-input"
        class="search-overlay__input"
        type="search"
        name="q"
        placeholder="Buscar…"
        autocomplete="off"
        [value]="query()"
        (input)="onQueryInput($event)"
      />
    </form>

    @if (suggestions().length > 0) {
      <ul class="search-overlay__results" role="listbox" aria-label="Sugerencias">
        @for (item of suggestions(); track item.kind + '-' + item.id) {
          <li role="option">
            <a
              class="search-overlay__result"
              [routerLink]="item.href"
              (click)="close()"
            >
              <span class="search-overlay__kind">{{ kindLabel(item.kind) }}</span>
              <span class="search-overlay__label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    } @else if (query().trim()) {
      <p class="search-overlay__empty">Sin resultados</p>
    }
  </div>
</div>
