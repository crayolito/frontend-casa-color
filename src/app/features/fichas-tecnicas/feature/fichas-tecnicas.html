<main class="fichas">
  @if (loading()) {
    <div class="fichas__skeleton" aria-busy="true" aria-live="polite">
      <p class="fichas__status">Cargando…</p>
    </div>
  } @else if (error(); as err) {
    <div class="fichas__error-wrap" role="alert">
      <div class="fichas__error">
        <p>{{ err.text }}</p>
        <button type="button" class="fichas__retry" (click)="load()">
          Reintentar
        </button>
      </div>
    </div>
  } @else {
    <div
      class="fichas__hero"
      [style.background-image]="'url(' + heroImageUrl() + ')'"
    >
      <app-container>
        <h1 class="fichas__title">{{ heading() }}</h1>
      </app-container>
    </div>

    <div class="fichas__content">
      <app-container>
        @if (categories().length === 0) {
          <p class="fichas__status">
            Todavía no hay fichas técnicas publicadas.
          </p>
        } @else {
          <div
            class="fichas__grid"
            [class.fichas__grid--cols-4]="categories().length >= 4"
            aria-label="Categorías de fichas técnicas"
          >
            @for (cat of categories(); track cat.categoryId) {
              <div class="fichas__column">
                <app-fichas-column [category]="cat" />
              </div>
            }
          </div>
        }
      </app-container>
    </div>
  }
</main>
