<div class="fichas-column">
  <div class="fichas-column__toggles">
    @if (category().catalogs.length === 0) {
      <p class="fichas-column__empty">Sin fichas técnicas en esta categoría.</p>
    } @else {
      @for (catalog of category().catalogs; track catalog.id; let i = $index) {
        <app-fichas-toggle
          [title]="catalog.name"
          [variant]="variantFor(i)"
          [panelId]="'ficha-' + category().categoryId + '-' + catalog.id"
        >
          <p class="fichas-column__links">
            @for (product of catalog.products; track product.id; let last = $last) {
              <a
                [href]="product.technicalSheetUrl"
                target="_blank"
                rel="noopener noreferrer"
                >{{ product.title }}</a
              >
              @if (!last) {
                <br />
              }
            }
          </p>
        </app-fichas-toggle>
      }
    }
  </div>
</div>
