<main class="home">
  @if (loading()) {
    <div class="home__skeleton" aria-busy="true" aria-live="polite">
      <p class="home__skeleton-text">Cargando…</p>
    </div>
  } @else if (error(); as err) {
    <div class="home__error" role="alert">
      <p>{{ err.text }}</p>
      <button type="button" class="home__retry" (click)="load()">Reintentar</button>
    </div>
  } @else if (content(); as c) {
    <app-hero-slider [banner]="c.banner" />
    <app-decor-divider [imageUrl]="c.findProduct.decorImageUrl" appReveal />
    <app-find-product [data]="c.findProduct" />
    <app-category-accordion [categories]="c.categories" />
    <app-graphic-section [imageUrl]="c.footer.topImageUrl" />
  }
</main>
