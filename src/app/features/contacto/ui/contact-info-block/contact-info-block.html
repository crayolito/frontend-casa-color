<div class="info-block">
  <div class="info-block__icon" aria-hidden="true">
    @switch (block().icon) {
      @case ('map-marker') {
        <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"
          />
        </svg>
      }
      @case ('phone') {
        <!-- Teléfono / WhatsApp -->
        <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor">
          <path
            d="M6.62 10.79a15.15 15.15 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.4 21 3 13.6 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
          />
        </svg>
      }
      @case ('envelope') {
        <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor">
          <path
            d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"
          />
        </svg>
      }
    }
  </div>
  <div class="info-block__text">
    @for (line of block().lines; track $index) {
      @if (line.href) {
        <a
          class="info-block__link"
          [class.info-block__link--strong]="line.strong"
          [href]="line.href"
          [attr.target]="line.href.startsWith('http') ? '_blank' : null"
          [attr.rel]="line.href.startsWith('http') ? 'noopener noreferrer' : null"
        >{{ line.text }}</a>
      } @else if (line.strong) {
        <strong>{{ line.text }}</strong>
      } @else {
        <span>{{ line.text }}</span>
      }
      @if (!$last) {
        <br />
      }
    }
  </div>
</div>
