@if (loadError()) {
  <div class="branch-picker-map branch-picker-map--error" role="alert">
    No se pudo cargar el mapa. Revisá la conexión o la API key.
  </div>
} @else if (ready()) {
  <google-map
    class="branch-picker-map"
    height="240px"
    width="100%"
    [center]="center()"
    [zoom]="zoom()"
    (mapClick)="onMapClick($event)"
  >
    <map-marker
      [position]="markerPos()"
      [options]="markerOptions"
      (mapDragend)="onMarkerDragEnd($event)"
    />
  </google-map>
} @else {
  <div class="branch-picker-map branch-picker-map--loading" aria-busy="true">
    Cargando mapa…
  </div>
}
