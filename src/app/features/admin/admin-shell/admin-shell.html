<div
  class="admin-shell"
  [class.admin-shell--nav-open]="navOpen()"
  [class.admin-shell--collapsed]="sidebarCollapsed()"
>
  <button
    type="button"
    class="admin-shell__backdrop"
    aria-label="Cerrar menú"
    (click)="closeNav()"
  ></button>

  <app-admin-sidebar
    [open]="navOpen()"
    [collapsed]="sidebarCollapsed()"
    (navigated)="closeNav()"
  />

  <div class="admin-shell__main">
    <app-admin-topbar
      (menuToggle)="toggleNav()"
      (collapseToggle)="toggleCollapse()"
    />
    <!-- Scroll a ancho completo (barra al borde); el content interno se centra. -->
    <main class="admin-shell__scroll" id="admin-main">
      <div class="admin-shell__content">
        <router-outlet />
      </div>
    </main>
  </div>

  <app-admin-toast-host />
</div>
