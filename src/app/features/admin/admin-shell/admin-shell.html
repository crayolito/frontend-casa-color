<div
  class="admin-shell"
  [class.admin-shell--nav-open]="navOpen()"
  [class.admin-shell--collapsed]="sidebarCollapsed()"
>
  <button
    type="button"
    class="admin-shell__backdrop"
    aria-label="Cerrar menú"
    (click)="closeNav()"
  ></button>

  <app-admin-sidebar
    [open]="navOpen()"
    [collapsed]="sidebarCollapsed()"
    (navigated)="closeNav()"
  />

  <div class="admin-shell__main">
    <app-admin-topbar
      (menuToggle)="toggleNav()"
      (collapseToggle)="toggleCollapse()"
    />
    <!-- Scroll a ancho completo (barra al borde); el content interno se centra. -->
    <main
      class="admin-shell__scroll"
      id="admin-main"
      [class.admin-shell__scroll--locked]="scrollLocked()"
    >
      <div class="admin-shell__content">
        <router-outlet />
      </div>
    </main>
  </div>

  @if (formCtx.dirty()) {
    <div class="admin-shell__mobile-save">
      <app-admin-save-bar
        [dirty]="true"
        [saving]="formCtx.saving()"
        (save)="formCtx.requestSave()"
        (discard)="formCtx.requestDiscard()"
      />
    </div>
  }

  <app-admin-toast-host />
</div>
