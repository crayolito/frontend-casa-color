<div class="color-card__media">
  @if (card().pdfUrl; as pdf) {
    <a class="color-card__img-link" [href]="pdf" target="_blank" rel="noopener noreferrer">
      <img
        class="color-card__img"
        [src]="imageSrc(card().imageUrl)"
        width="400"
        height="375"
        [alt]="card().titlePrefix + card().titleStrong"
        loading="lazy"
        decoding="async"
        appImgFallback="product"
      />
    </a>
  } @else {
    <img
      class="color-card__img"
      [src]="imageSrc(card().imageUrl)"
      width="400"
      height="375"
      [alt]="card().titlePrefix + card().titleStrong"
      loading="lazy"
      decoding="async"
      appImgFallback="product"
    />
  }
</div>

<div class="color-card__body">
  <div class="color-card__title">
    <span class="color-card__title-text"
      >{{ card().titlePrefix }}<strong>{{ card().titleStrong }}</strong></span
    >
  </div>

  @if (card().descriptionHtml) {
    <div
      class="color-card__text"
      [innerHTML]="card().descriptionHtml | safeHtml"
    ></div>
  }

  <div
    class="color-card__spacer"
    [style.height.px]="card().descriptionHtml ? 30 : 70"
    aria-hidden="true"
  ></div>

  @if (card().pdfUrl; as pdf) {
    <a
      class="color-card__button"
      [href]="pdf"
      target="_blank"
      rel="noopener noreferrer"
      role="button"
    >
      <span>{{ card().buttonLabel }}</span>
    </a>
  }
</div>
