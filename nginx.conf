server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets de texto (JS, CSS, HTML, SVG).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Cache fuerte para archivos con hash (Angular usa outputHashing: 'all').
    # Como el nombre cambia en cada build, este cache es seguro a largo plazo.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html: nunca cachear (para que cambios de deploy se apliquen ya).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # API NestJS vía red Docker — mismo dominio público (/api), sin subdominio expuesto.
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # SPA fallback: cualquier ruta que no sea archivo físico vuelve a index.html
    # (esencial para que el Angular Router maneje las rutas en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No exponer archivos ocultos (.git, .env, etc.).
    location ~ /\. {
        deny all;
    }
}
